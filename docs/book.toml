[book]
title = "Parallax Documentation"
authors = ["Parallax Contributors"]
description = "Universal polyglot execution runtime — capture, migrate, and restore program state across languages."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.index]

[preprocessor.links]

[output.html]
site-url = "/parallax/"
git-repository-url = "https://github.com/parallax-runtime/parallax"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/parallax-runtime/parallax/edit/main/docs/src/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = false
additional-css = ["theme/custom.css"]
additional-js = ["theme/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true

[output.html.playground]
editable = false
copyable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
