[workspace]
resolver = "2"
members = [
    "crates/parallax-core",
    "crates/parallax-ir",
    "crates/parallax-pcir",
    "crates/parallax-ues",
    "crates/parallax-puir",
    "crates/parallax-project",
    "crates/parallax-protocol",
    "crates/parallax-security",
    "crates/parallax-diagnostics",
    "crates/parallax-snapshot",
    "crates/parallax-migrate",
    "crates/parallax-transmute",
    "crates/parallax-mirror",
    "crates/parallax-runtime",
    "crates/parallax-adapter-python",
    "crates/parallax-adapter-js",
    "crates/parallax-adapter-wasm",
    "crates/parallax-connectors",
    "crates/parallax-adapter-sdk",
    "crates/parallax-atlas",
    "crates/parallax-horizon",
    "crates/parallax-cli",
]
default-members = ["crates/parallax-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/parallax-runtime/parallax"
authors = ["Parallax Contributors"]
rust-version = "1.75"

[workspace.dependencies]
parallax-core = { path = "crates/parallax-core" }
parallax-ir = { path = "crates/parallax-ir" }
parallax-pcir = { path = "crates/parallax-pcir" }
parallax-ues = { path = "crates/parallax-ues" }
parallax-puir = { path = "crates/parallax-puir" }
parallax-project = { path = "crates/parallax-project" }
parallax-protocol = { path = "crates/parallax-protocol" }
parallax-transmute = { path = "crates/parallax-transmute" }
parallax-mirror = { path = "crates/parallax-mirror" }
parallax-security = { path = "crates/parallax-security" }
parallax-diagnostics = { path = "crates/parallax-diagnostics" }
parallax-snapshot = { path = "crates/parallax-snapshot" }
parallax-migrate = { path = "crates/parallax-migrate" }
parallax-runtime = { path = "crates/parallax-runtime" }
parallax-adapter-python = { path = "crates/parallax-adapter-python" }
parallax-adapter-js = { path = "crates/parallax-adapter-js" }
parallax-adapter-wasm = { path = "crates/parallax-adapter-wasm" }
parallax-connectors = { path = "crates/parallax-connectors" }
parallax-adapter-sdk = { path = "crates/parallax-adapter-sdk" }
parallax-atlas = { path = "crates/parallax-atlas" }
parallax-horizon = { path = "crates/parallax-horizon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env", "color"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }
sha2 = "0.10"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1"
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
wasmtime = { version = "29", default-features = true, features = ["cranelift", "wat"] }
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
